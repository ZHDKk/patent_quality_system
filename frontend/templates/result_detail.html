{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <h2 style="margin: 0;">质检详情</h2>
    <a href="
        {% if view_user %}
            {{ url_for('main.user_results', user_id=view_user.id) }}
        {% else %}
            {{ url_for('main.results') }}
        {% endif %}
    " class="btn btn-primary">← 返回结果列表</a>
</div>

<div style="margin-bottom: 1.5rem;">
    <h3 style="margin-bottom: 0.5rem;">{{ doc.filename }}</h3>
    <p style="color: var(--text-secondary);" id="upload-time" data-upload="{{ doc.upload_time.isoformat() }}">上传时间: 加载中...</p>
</div>

<div id="action-buttons" style="margin-bottom: 1rem; display: flex; gap: 1rem;">
    {% if results and results[0] %}
        {% if results[0].revised_doc_path %}
            <a href="{{ url_for('main.download_revised', result_id=results[0].id) }}" class="btn btn-success">下载报告文档</a>
        {% else %}
            <button id="generateRevisedBtn" class="btn btn-info" data-result-id="{{ results[0].id }}">生成报告文档</button>
            <div id="generatingMsg" style="display:none; color: #17a2b8;"><span class="spinner"></span> 生成中...</div>
        {% endif %}
    {% endif %}
</div>

<div id="issues-table-container">
    <p>加载中...</p>
</div>
<div id="pagination" class="pagination"></div>

<style>
.issues-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
    background: rgba(15,23,42,0.5);
    border-radius: 8px;
    overflow: hidden;
}
.issues-table th, .issues-table td {
    border: 1px solid var(--border-color);
    padding: 0.75rem;
    text-align: left;
    vertical-align: top;
}
.issues-table th {
    background: rgba(30, 41, 59, 0.8);
    font-weight: 600;
}
.pagination {
    margin-top: 2rem;
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
}
.pagination a, .pagination span.current {
    padding: 0.5rem 0.8rem;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    text-decoration: none;
    color: var(--text-primary);
    background: rgba(15,23,42,0.5);
}
.pagination a:hover { background: rgba(255,255,255,0.1); }
.pagination span.current { background: var(--primary); color: white; border-color: var(--primary); }
.pagination span.ellipsis { padding: 0.5rem 0.8rem; color: var(--text-secondary); }
.spinner {
    display: inline-block;
    width: 1rem;
    height: 1rem;
    border: 2px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: var(--primary);
    animation: spin 1s ease-in-out infinite;
    margin-right: 0.5rem;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
.btn-info { background-color: #17a2b8; color: white; }
.btn-info:hover { background-color: #138496; }
.btn-success { background-color: #28a745; color: white; }
.btn-success:hover { background-color: #218838; }
</style>

<script>
const results = {{ results|tojson }};
const docUploadTime = "{{ doc.upload_time.isoformat() }}";
document.getElementById('upload-time').textContent = `上传时间: ${new Date(docUploadTime).toLocaleString()}`;

let allIssues = [];
try {
    if (results && results.length > 0) {
        results.forEach(res => {
            const version = res.version;
            const checkTime = new Date(res.check_time).toLocaleString();
            const resultJson = res.result_json;
            const ruleName = res.rule_name || '';

            function addIssue(issue) {
                allIssues.push({
                    version: version,
                    check_time: checkTime,
                    rule_id: issue.rule_id || '',
                    issue: issue.issue || issue.description || '',
                    suggestion: issue.suggestion || '',
                    severity: issue.severity || '提示',
                    rule_name: ruleName
                });
            }

            if (Array.isArray(resultJson)) {
                resultJson.forEach(addIssue);
            } else if (resultJson && typeof resultJson === 'object') {
                if (resultJson.issues && Array.isArray(resultJson.issues)) {
                    resultJson.issues.forEach(addIssue);
                } else if (resultJson.raw_output) {
                    allIssues.push({
                        version: version,
                        check_time: checkTime,
                        rule_id: '原始输出',
                        issue: '',
                        suggestion: '',
                        severity: '信息',
                        raw: resultJson.raw_output,
                        rule_name: ruleName
                    });
                }
            }
        });
    }
} catch (e) {
    console.error('解析结果时出错:', e);
}

const itemsPerPage = 10;
let currentPage = 1;

function escapeHtml(unsafe) {
    if (unsafe === null || unsafe === undefined) return '';
    const str = String(unsafe);
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function renderTable(page) {
    const start = (page - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const pageIssues = allIssues.slice(start, end);
    const container = document.getElementById('issues-table-container');
    if (allIssues.length === 0) {
        container.innerHTML = '<p>暂无质检结果</p>';
        document.getElementById('pagination').innerHTML = '';
        return;
    }
    let tableHtml = '<table class="issues-table"><thead><tr>' +
        '<th>版本</th><th>规则版本</th><th>规则ID</th><th>问题描述</th><th>建议</th><th>严重程度</th>' +
        '</tr></thead><tbody>';
    pageIssues.forEach(issue => {
        if (issue.rule_id === '原始输出') {
            tableHtml += `<tr><td colspan="6"><div class="raw-output">${escapeHtml(issue.raw)}</div></td></tr>`;
        } else {
            tableHtml += `<tr>
                <td>${escapeHtml(issue.version)}</td>
                <td>${escapeHtml(issue.rule_name)}</td>
                <td>${escapeHtml(issue.rule_id)}</td>
                <td>${escapeHtml(issue.issue)}</td>
                <td>${escapeHtml(issue.suggestion)}</td>
                <td>${escapeHtml(issue.severity)}</td>
            </tr>`;
        }
    });
    tableHtml += '</tbody></table>';
    container.innerHTML = tableHtml;
    renderPagination();
}

function renderPagination() {
    const totalPages = Math.ceil(allIssues.length / itemsPerPage);
    const paginationDiv = document.getElementById('pagination');
    if (totalPages <= 1) {
        paginationDiv.innerHTML = '';
        return;
    }
    let html = '';
    if (currentPage > 1) {
        html += `<a href="#" data-page="${currentPage-1}">上一页</a>`;
    }
    for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
            html += `<span class="current">${i}</span>`;
        } else {
            html += `<a href="#" data-page="${i}">${i}</a>`;
        }
    }
    if (currentPage < totalPages) {
        html += `<a href="#" data-page="${currentPage+1}">下一页</a>`;
    }
    paginationDiv.innerHTML = html;
    paginationDiv.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const page = parseInt(e.target.dataset.page);
            if (page && page !== currentPage) {
                currentPage = page;
                renderTable(currentPage);
            }
        });
    });
}

renderTable(1);

const generateBtn = document.getElementById('generateRevisedBtn');
if (generateBtn) {
    generateBtn.addEventListener('click', async function() {
        const resultId = this.dataset.resultId;
        const msgDiv = document.getElementById('generatingMsg');
        const actionDiv = document.getElementById('action-buttons');
        this.style.display = 'none';
        msgDiv.style.display = 'block';
        try {
            const response = await fetch(`/api/result/${resultId}/generate_revised`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await response.json();
            if (data.status === 'success') {
                msgDiv.style.display = 'none';
                const downloadLink = document.createElement('a');
                downloadLink.href = `/download/revised/${resultId}`;
                downloadLink.className = 'btn btn-success';
                downloadLink.textContent = '下载报告文档';
                actionDiv.appendChild(downloadLink);
            } else {
                alert('生成失败：' + (data.error || '未知错误'));
                this.style.display = 'inline-block';
                msgDiv.style.display = 'none';
            }
        } catch (err) {
            alert('请求失败：' + err);
            this.style.display = 'inline-block';
            msgDiv.style.display = 'none';
        }
    });
}
</script>
{% endblock %}
