{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <h2 style="margin: 0;">质检详情</h2>
    <a href="{{ url_for('main.results') }}" class="btn btn-primary">← 返回结果列表</a>
</div>

<div style="margin-bottom: 1.5rem;">
    <h3 style="margin-bottom: 0.5rem;">{{ doc.filename }}</h3>
    <p style="color: var(--text-secondary);" id="upload-time" data-upload="{{ doc.upload_time.isoformat() }}">上传时间: 加载中...</p>
</div>

<!-- 问题表格容器 -->
<div id="issues-table-container">
    <p>加载中...</p>
</div>

<!-- 分页控件 -->
<div id="pagination" class="pagination"></div>

<style>
/* 表格样式 */
.issues-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
    background: rgba(15,23,42,0.5);
    border-radius: 8px;
    overflow: hidden;
}
.issues-table th, .issues-table td {
    border: 1px solid var(--border-color);
    padding: 0.75rem;
    text-align: left;
    vertical-align: top;
}
.issues-table th {
    background: rgba(30, 41, 59, 0.8);
    font-weight: 600;
}
.issues-table td {
    word-break: break-word;
}
/* 分页样式 */
.pagination {
    margin-top: 2rem;
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
}
.pagination a, .pagination span.current {
    padding: 0.5rem 0.8rem;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    text-decoration: none;
    color: var(--text-primary);
    background: rgba(15,23,42,0.5);
}
.pagination a:hover {
    background: rgba(255,255,255,0.1);
}
.pagination span.current {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}
.pagination span.ellipsis {
    padding: 0.5rem 0.8rem;
    color: var(--text-secondary);
}
/* 原始输出样式 */
.raw-output {
    background: rgba(0,0,0,0.3);
    padding: 1rem;
    border-radius: 4px;
    font-family: monospace;
    white-space: pre-wrap;
    word-break: break-word;
}
</style>

<script>
// 从后端接收的数据（已由视图函数处理为可序列化格式）
const results = {{ results|tojson }};
const docUploadTime = "{{ doc.upload_time.isoformat() }}";

// 格式化上传时间
document.getElementById('upload-time').textContent = `上传时间: ${new Date(docUploadTime).toLocaleString()}`;

// 收集所有问题
let allIssues = [];

if (results && results.length > 0) {
    results.forEach(res => {
        const version = res.version;
        const checkTime = new Date(res.check_time).toLocaleString();
        const resultJson = res.result_json;  // 此时 result_json 已经是对象（字典）

        // 检查是否有 issues 数组
        if (resultJson.issues && Array.isArray(resultJson.issues) && resultJson.issues.length > 0) {
            resultJson.issues.forEach(issue => {
                allIssues.push({
                    version: version,
                    check_time: checkTime,
                    rule_id: issue.rule_id || '',
                    issue: issue.issue || issue.description || '',
                    suggestion: issue.suggestion || '',
                    severity: issue.severity || '提示'
                });
            });
        }
        // 如果有原始输出且无 issues，则单独添加一条记录
        else if (resultJson.raw_output) {
            allIssues.push({
                version: version,
                check_time: checkTime,
                rule_id: '原始输出',
                issue: '',
                suggestion: '',
                severity: '信息',
                raw: resultJson.raw_output
            });
        }
        // 如果既无 issues 也无 raw_output，可添加一条占位记录（可选）
        else {
            allIssues.push({
                version: version,
                check_time: checkTime,
                rule_id: '无数据',
                issue: '该版本质检结果无结构化数据',
                suggestion: '',
                severity: '提示'
            });
        }
    });
}

// 分页配置
const itemsPerPage = 10;
let currentPage = 1;

// 简单的HTML转义函数
function escapeHtml(unsafe) {
    if (!unsafe) return '';
    return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function renderTable(page) {
    const start = (page - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const pageIssues = allIssues.slice(start, end);

    const container = document.getElementById('issues-table-container');
    if (allIssues.length === 0) {
        container.innerHTML = '<p>暂无质检结果</p>';
        document.getElementById('pagination').innerHTML = '';
        return;
    }

    let tableHtml = '<table class="issues-table"><thead><tr><th>版本</th><th>规则ID</th><th>问题描述</th><th>建议</th><th>严重程度</th></tr></thead><tbody>';

    pageIssues.forEach(issue => {
        if (issue.rule_id === '原始输出') {
            // 原始输出合并所有列
            tableHtml += `<tr><td colspan="5"><div class="raw-output">${escapeHtml(issue.raw)}</div></td></tr>`;
        } else {
            tableHtml += `<tr>
                <td>${escapeHtml(issue.version)}</td>
                <td>${escapeHtml(issue.rule_id)}</td>
                <td>${escapeHtml(issue.issue)}</td>
                <td>${escapeHtml(issue.suggestion)}</td>
                <td>${escapeHtml(issue.severity)}</td>
            </tr>`;
        }
    });

    tableHtml += '</tbody></table>';
    container.innerHTML = tableHtml;
    renderPagination();
}

function renderPagination() {
    const totalPages = Math.ceil(allIssues.length / itemsPerPage);
    const paginationDiv = document.getElementById('pagination');
    if (totalPages <= 1) {
        paginationDiv.innerHTML = '';
        return;
    }
    let html = '';
    if (currentPage > 1) {
        html += `<a href="#" data-page="${currentPage-1}">上一页</a>`;
    }
    for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
            html += `<span class="current">${i}</span>`;
        } else {
            html += `<a href="#" data-page="${i}">${i}</a>`;
        }
    }
    if (currentPage < totalPages) {
        html += `<a href="#" data-page="${currentPage+1}">下一页</a>`;
    }
    paginationDiv.innerHTML = html;

    paginationDiv.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const page = parseInt(e.target.dataset.page);
            if (page && page !== currentPage) {
                currentPage = page;
                renderTable(currentPage);
            }
        });
    });
}

// 初始渲染
renderTable(1);
</script>
{% endblock %}
