{% extends "base.html" %}
{% block content %}
<div class="login-container" style="display: flex; align-items: center; justify-content: center; gap: 3rem; min-height: 60vh;">
    <div class="logo-area">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="max-width: 300px;">
    </div>
    <div class="login-form" style="width: 320px; background: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color);">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">登录系统</h2>
        <form method="post">
            <div style="margin-bottom: 1.2rem;">
                <label style="display: block; margin-bottom: 0.3rem;">用户名</label>
                <input type="text" name="username" required style="width: 100%; padding: 0.6rem; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.3rem;">密码</label>
                <input type="password" name="password" required style="width: 100%; padding: 0.6rem; border-radius: 6px;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
        </form>
    </div>
</div>
{% endblock %}
