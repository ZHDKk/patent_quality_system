{% extends "base.html" %}
{% block content %}
<h2>上传专利文件</h2>

<!-- 单个文件上传 -->
<form id="uploadForm" enctype="multipart/form-data">
    <div class="form-group">
        <label>文档解析方式：</label>
        <div style="display: flex; gap: 1.5rem; margin-top: 0.5rem;">
            <label><input type="radio" name="parse_mode" value="local" checked> 本地解析</label>
            <label><input type="radio" name="parse_mode" value="online"> 在线解析</label>
        </div>
    </div>
    <div class="form-group">
        <label>AI模型选择：</label>
        <select name="model" class="form-control">
            <option value="kimi-k2-turbo-preview" selected>Kimi (k2-turbo-preview)</option>
            <option value="moonshot-v1-8k" disabled>Moonshot v1 8K (即将支持)</option>
        </select>
    </div>
    <div class="form-group">
        <label>选择文件：</label>
        <input type="file" name="file" accept=".doc,.docx,.pdf" required>
    </div>
    <div class="form-group">
        <label>是否为二次质检？</label>
        <div style="display: flex; gap: 1.5rem; margin-top: 0.5rem;">
            <label><input type="radio" name="is_recheck" value="no" checked> 首次提交</label>
            <label><input type="radio" name="is_recheck" value="yes"> 基于上次结果修改</label>
        </div>
    </div>
    <div id="recheckOptions" style="display:none;">
        <label>选择上次质检结果：</label>
        <select name="parent_result_id" class="form-control">
            {% for doc in recent_docs %}
                {% if doc.results %}
                    <optgroup label="{{ doc.filename }}">
                    {% for res in doc.results %}
                        <option value="{{ res.id }}">版本{{ res.version }} ({{ res.check_time }})</option>
                    {% endfor %}
                    </optgroup>
                {% endif %}
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary" id="singleUploadBtn">开始质检</button>
    <div id="singleLoading" style="display:none; margin-top:1rem;"><span class="spinner"></span> 上传中...</div>
</form>

<!-- 批量上传区域 -->
<h3>批量上传</h3>
<div id="batchUploadArea">
    <div class="form-group">
        <label>选择多个文件：</label>
        <input type="file" id="batchFileInput" multiple accept=".doc,.docx,.pdf">
        <button type="button" id="addFilesBtn" class="btn btn-secondary" style="margin-left:1rem;">添加文件</button>
    </div>
    <div id="fileList" style="margin-bottom:1rem;"></div>
    <button type="button" id="batchUploadBtn" class="btn btn-primary" disabled>批量上传并质检</button>
    <div id="batchLoading" style="display:none; margin-top:1rem;"><span class="spinner"></span> 批量上传中...</div>
</div>

<script>
document.querySelectorAll('input[name="is_recheck"]').forEach(radio => {
    radio.addEventListener('change', function() {
        document.getElementById('recheckOptions').style.display = this.value === 'yes' ? 'block' : 'none';
    });
});

// 单文件上传
document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('singleUploadBtn');
    const loading = document.getElementById('singleLoading');
    btn.disabled = true;
    loading.style.display = 'block';
    const formData = new FormData(e.target);
    try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        const result = await response.json();
        if (result.error) {
            alert('错误：' + result.error);
        } else {
            alert('上传成功，任务ID：' + result.doc_id);
            window.location.href = '/results';
        }
    } catch (err) {
        alert('上传失败：' + err);
    } finally {
        btn.disabled = false;
        loading.style.display = 'none';
    }
});

// ==================== 批量上传逻辑 ====================
let selectedFiles = []; // 存储 { file, name, size, error? }

const fileInput = document.getElementById('batchFileInput');
const addBtn = document.getElementById('addFilesBtn');
const fileListDiv = document.getElementById('fileList');
const batchUploadBtn = document.getElementById('batchUploadBtn');
const batchLoading = document.getElementById('batchLoading');

function renderFileList() {
    if (selectedFiles.length === 0) {
        fileListDiv.innerHTML = '<p style="color: var(--text-secondary);">暂无文件</p>';
        batchUploadBtn.disabled = true;
        return;
    }
    let html = '<ul style="list-style:none; padding:0;">';
    selectedFiles.forEach((f, index) => {
        html += `<li style="display: flex; align-items: center; justify-content: space-between; padding: 0.5rem; border: 1px solid var(--border-color); margin-bottom:0.3rem; border-radius:4px;">
            <span>${f.name} (${(f.size/1024).toFixed(2)} KB) ${f.error ? '<span style="color:red;">文件类型错误</span>' : ''}</span>
            <button type="button" class="btn btn-danger btn-sm" onclick="removeFile(${index})">删除</button>
        </li>`;
    });
    html += '</ul>';
    fileListDiv.innerHTML = html;
    batchUploadBtn.disabled = selectedFiles.some(f => f.error) || selectedFiles.length === 0;
}

window.removeFile = function(index) {
    selectedFiles.splice(index, 1);
    renderFileList();
};

addBtn.addEventListener('click', () => {
    const files = Array.from(fileInput.files);
    const allowed = ['doc','docx','pdf'];
    files.forEach(file => {
        const ext = file.name.split('.').pop().toLowerCase();
        const error = !allowed.includes(ext);
        selectedFiles.push({ file, name: file.name, size: file.size, error });
    });
    fileInput.value = ''; // 清空input
    renderFileList();
});

batchUploadBtn.addEventListener('click', async () => {
    if (selectedFiles.length === 0) return;
    console.log('所有选中文件:', selectedFiles.map(f => f.name));
    console.log('有效文件数:', selectedFiles.filter(f => !f.error).length);
    console.log('FormData 中的文件列表:');
    const testFormData = new FormData();
    selectedFiles.filter(f => !f.error).forEach(f => testFormData.append('files', f.file));
    for (let pair of testFormData.entries()) {
        console.log(pair[0], pair[1].name);
    }

    const formData = new FormData();
    const validFiles = selectedFiles.filter(f => !f.error);

    if (validFiles.length === 0) {
        alert('没有可上传的有效文件（请检查文件类型）');
        return;
    }

    // 将所有有效文件添加到 FormData
    validFiles.forEach(f => formData.append('files', f.file));

    // 添加解析方式和模型
    const parseMode = document.querySelector('input[name="parse_mode"]:checked').value;
    const model = document.querySelector('select[name="model"]').value;
    formData.append('parse_mode', parseMode);
    formData.append('model', model);

    // 禁用按钮，显示 loading
    batchUploadBtn.disabled = true;
    batchLoading.style.display = 'block';

    try {
        const response = await fetch('/batch_upload', {
            method: 'POST',
            body: formData
        });
        const result = await response.json();

        if (result.status === 'success') {
            let message = `✅ 成功提交 ${result.count} 个文件`;
            if (result.failed && result.failed.length > 0) {
                message += `，但以下文件失败：\n`;
                result.failed.forEach(f => {
                    message += `- ${f.name}: ${f.reason}\n`;
                });
            } else {
                message += `，全部成功！`;
            }
            alert(message);

            // 清空文件列表
            selectedFiles = [];
            renderFileList();

            // 可选：跳转到结果页
            window.location.href = '/results';
        } else {
            alert('❌ 上传失败：' + (result.error || '未知错误'));
        }
    } catch (err) {
        alert('❌ 批量上传异常：' + err);
    } finally {
        batchUploadBtn.disabled = false;
        batchLoading.style.display = 'none';
    }
});
</script>
{% endblock %}
