{% extends "base.html" %}
{% block content %}
<h2>创建新用户</h2>
<form method="post">
    <div class="form-group">
        <label>用户名:</label>
        <input type="text" name="username" required>
    </div>
    <div class="form-group">
        <label>密码:</label>
        <input type="password" name="password" required>
    </div>
    <div class="form-group">
        <label>角色:</label>
        <select name="role">
            <option value="employee" selected>普通用户</option>
            <option value="admin">管理员</option>
        </select>
    </div>
    <div class="form-group">
        <label>权限分配（普通用户可选）:</label><br>
        {% for perm in permissions %}
        <div style="margin:0.3rem 0;">
            <label>
                <input type="checkbox" name="permissions" value="{{ perm.id }}"
                    {% if perm.id in ['upload','view_results'] %}checked{% endif %}>
                {{ perm.name }}
            </label>
        </div>
        {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary">创建</button>
</form>
{% endblock %}
